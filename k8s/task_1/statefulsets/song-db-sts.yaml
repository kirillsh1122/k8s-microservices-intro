apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: song-db
  namespace: k8s-program
  labels:
    app: song-db
spec:
  serviceName: song-db-pods
  replicas: 1
  selector:
    matchLabels:
      app: song-db
  template:
    metadata:
      labels:
        app: song-db
    spec:
      containers:
      - name: song-db
        image: k8s-java-private-registry.local:5000/postgres:17-alpine
        envFrom:
          - configMapRef:
              name: db-config
        ports:
          - containerPort: 5432
            protocol: TCP
            name: postgres-port
        volumeMounts:
        - name: song-db-data
          mountPath: /var/lib/postgresql/data
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-2
  volumeClaimTemplates:
    - metadata:
        name: song-db-data
        labels:
          app: song-db
      spec:
        storageClassName: db-stateful-sc
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi

---
apiVersion: v1
kind: Service
metadata:
  name: song-db-pods
  namespace: k8s-program
  labels:
    app: song-db
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: song-db
  ports:
  - name: postgres-port
    port: 5432
    targetPort: 5432
    protocol: TCP
