apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: song-ms-deployment
  name: song-ms-deployment
  namespace: k8s-program
spec:
  replicas: 2
  selector:
    matchLabels:
      app: song-ms-deployment
  strategy: {}
  template:
    metadata:
      labels:
        app: song-ms-deployment
    spec:
      volumes:
        - name: manual-song-pv
          persistentVolumeClaim:
            claimName: manual-songs-pvc
      containers:
      - image: k8s-java-private-registry.local:5000/song-service-k8s:v1.0.0
        name: songs-ms-k8s
        envFrom:
          - configMapRef:
              name: song-ms-cm
        volumeMounts:
          - name: manual-song-pv
            mountPath: /tmp/song-manual-storage
        ports:
          - containerPort: 8081
            protocol: TCP
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          periodSeconds: 5
          failureThreshold: 10
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          periodSeconds: 5
          failureThreshold: 1
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          periodSeconds: 5
          failureThreshold: 2
          successThreshold: 3
          timeoutSeconds: 2
        resources: {}
status: {}
