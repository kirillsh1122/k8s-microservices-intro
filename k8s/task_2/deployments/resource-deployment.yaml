apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: resource-ms-deployment
  name: resource-ms-deployment
  namespace: k8s-program
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resource-ms-deployment
  strategy: {}
  template:
    metadata:
      labels:
        app: resource-ms-deployment
    spec:
      containers:
      - image: k8s-java-private-registry.local:5000/resource-service-k8s:v1.0.0
        name: resources-ms-k8s
        envFrom:
          - configMapRef:
              name: resource-ms-cm
        ports:
          - containerPort: 8080
            protocol: TCP
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 5
          failureThreshold: 10
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 5
          failureThreshold: 1
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 5
          failureThreshold: 2
          successThreshold: 3
          timeoutSeconds: 2
        resources: {}
status: {}
